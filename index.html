<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗂️</text></svg>">
    <title>Video Converter | MKV to MP4</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #1a1a1a; color: #ffffff; font-family: ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
        .step { display: none; }
        .step.active { display: flex; }
        .drop-zone { border: 2px dashed rgba(255,255,255,0.08); transition: all 0.2s ease; cursor: pointer; border-radius: 40px; background-color: rgba(255,255,255,0.02); }
        .drop-zone:hover, .drop-zone.dragover { border-color: #fff; background-color: rgba(255,255,255,0.05); }
        .progress-bar { height: 100%; background: #fff; width: 0%; transition: width 0.4s ease; }
        button, .btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        button:active { transform: scale(0.97); }
        
        .header-title {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            text-align: center;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, 0); }
            50% { transform: translate(-50%, -6px); }
        }

        .kamen-link {
            color: #888;
            text-decoration: none;
            position: relative;
            transition: color 0.3s ease;
        }
        
        .kamen-link:hover {
            color: #fff;
        }

        .kamen-link::after {
            content: attr(data-label);
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            font-style: normal;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0;
            transition: all 0.3s ease;
            white-space: nowrap;
            color: #555;
            pointer-events: none;
        }

        .kamen-link:hover::after {
            opacity: 1;
            bottom: -28px;
        }

        .lang-switcher {
            position: absolute;
            top: 40px;
            right: 40px;
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0.2em;
            background-color: #000000;
            color: #ffffff;
            padding: 14px 26px;
            border-radius: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            user-select: none;
            border: 1px solid rgba(255,255,255,0.08);
        }
        
        @media (max-width: 640px) {
            .lang-switcher {
                top: 130px;
                right: 20px;
            }
            .header-title {
                top: 60px;
            }
        }

        .lang-switcher:hover { 
            transform: translateY(-2px);
            background-color: #050505;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        .btn-kamen {
            background-color: #ffffff;
            color: #1a1a1a;
            border-radius: 30px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .btn-kamen:hover {
            background-color: #f0f0f0;
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-8 relative overflow-hidden">

    <div id="langSwitcher" class="lang-switcher">
        <span>🌐︎</span>
        <span id="langLabel">EN</span>
    </div>

    <div class="header-title">
        <h1 class="text-4xl font-black tracking-tighter italic text-white drop-shadow-2xl text-center">
            <a href="https://legimency.github.io/kamen3D/" target="_blank" class="kamen-link" id="kamenLink" data-label="click">Kamen</a> & COnvert
        </h1>
    </div>

    <main class="w-full max-w-md text-center mt-12 z-10">
        <!-- Шаг 1: Выбор (Главная кнопка) -->
        <div id="step1" class="step active flex-col items-center w-full">
            <button id="selectMkvBtn" class="w-full py-8 btn-kamen text-xl shadow-2xl cursor-pointer transition-all">
                .mkv to .mp4
            </button>
            <p id="t-selectFormat" class="mt-6 text-[8px] sm:text-[9px] text-gray-300 uppercase tracking-[0.3em] font-bold text-center whitespace-nowrap">Select the format you want to convert to</p>
        </div>

        <!-- Шаг 2: Загрузка (Drag & Drop) -->
        <div id="step2" class="step flex-col items-center w-full">
            <div id="dropZone" class="w-full aspect-square flex flex-col items-center justify-center p-12 drop-zone shadow-2xl">
                <div class="mb-6 opacity-30 text-white">
                    <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                        <path d="M12 4v16m8-8H4" stroke-linecap="round"/>
                    </svg>
                </div>
                <p class="font-bold text-sm uppercase tracking-[0.3em] mb-2 text-white">.mkv</p>
                <p id="t-dropHint" class="text-[9px] text-gray-300 uppercase tracking-widest text-center font-bold text-center px-4">drag & drop</p>
                <input type="file" id="fileInput" accept=".mkv" class="hidden">
            </div>
        </div>

        <!-- Шаг 3: Готовность (Кнопка Конвертировать) -->
        <div id="step3" class="step flex-col items-center w-full">
            <div class="w-full mb-8 py-10 px-6 bg-white/5 rounded-[40px] border border-white/5 overflow-hidden shadow-inner text-center">
                <p id="fileName" class="text-[10px] font-mono truncate text-gray-400 uppercase tracking-widest"></p>
            </div>
            <button id="convertBtn" class="w-full py-6 btn-kamen text-lg shadow-2xl cursor-pointer transition-all">
                convert
            </button>
        </div>

        <!-- Шаг 4: Прогресс -->
        <div id="step4" class="step flex-col items-center w-full text-center">
            <div class="w-full bg-white/5 rounded-full h-1.5 mb-8 overflow-hidden">
                <div id="progressBar" class="progress-bar shadow-[0_0_15px_rgba(255,255,255,0.5)]"></div>
            </div>
            <p id="progressStatus" class="text-[9px] font-black tracking-[0.5em] uppercase text-gray-500 italic animate-pulse">Processing...</p>
        </div>

        <!-- Шаг 5: Успех -->
        <div id="step5" class="step flex-col items-center w-full text-center">
            <div class="w-24 h-24 bg-white text-black rounded-full flex items-center justify-center mb-10 shadow-[0_0_50px_rgba(255,255,255,0.15)] mx-auto">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                    <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <a id="downloadBtn" class="w-full py-6 btn-kamen text-lg shadow-2xl text-center block mb-6 cursor-pointer transition-all">
                download
            </a>
            <button id="resetBtn" class="text-[9px] font-bold text-gray-300 hover:text-white uppercase tracking-[0.4em] cursor-pointer transition-colors mx-auto">
                convert new file
            </button>
        </div>

        <div id="errorMsg" class="hidden mt-8 p-6 bg-red-500/10 text-red-400 text-[10px] rounded-[30px] font-mono leading-relaxed text-left border border-red-500/20"></div>
    </main>

    <footer class="fixed bottom-10 text-center px-4 w-full opacity-80">
        <p id="t-footer" class="text-[8px] text-gray-300 uppercase tracking-[0.6em] font-medium italic">Conversion takes place locally</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.0/dist/ffmpeg.min.js"></script>

    <script>
        const { createFFmpeg, fetchFile } = FFmpeg;
        
        const ffmpeg = createFFmpeg({
            log: true,
            mainName: 'main', 
            corePath: 'https://cdn.jsdelivr.net/npm/@ffmpeg/core-st@0.11.1/dist/ffmpeg-core.js'
        });

        const $ = (id) => document.getElementById(id);
        
        let currentDownloadUrl = null;

        // --- Локализация ---
        let currentLang = 'en';
        const i18n = {
            en: {
                selectMode: ".mkv to .mp4",
                selectFormat: "Select the format you want to convert to",
                dropHint: "drag & drop",
                convert: "convert",
                download: "download",
                convertNew: "convert new file",
                footer: "Conversion takes place locally",
                initializing: "Initializing...",
                loadingCore: "Loading Core...",
                readingFile: "Reading video...",
                converting: "Converting...",
                finalizing: "Finalizing...",
                done: "Done",
                error: "ERROR",
                selectMkvAlert: "Please select MKV file",
                kamenHint: "click"
            },
            ru: {
                selectMode: ".mkv в .mp4",
                selectFormat: "Выберите формат в который вы хотите конвертировать",
                dropHint: "перетащите файл",
                convert: "конвертировать",
                download: "скачать",
                convertNew: "загрузить новый файл",
                footer: "вся обработка происходит на клиенте",
                initializing: "Инициализация...",
                loadingCore: "Загрузка движка...",
                readingFile: "Чтение видео...",
                converting: "Конвертация...",
                finalizing: "Завершение...",
                done: "Готово",
                error: "ОШИБКА",
                selectMkvAlert: "Пожалуйста, выберите MKV файл",
                kamenHint: "нажми"
            }
        };

        function toggleLang() {
            currentLang = currentLang === 'en' ? 'ru' : 'en';
            updateUIStrings();
        }

        function updateUIStrings() {
            const t = i18n[currentLang];
            $('langLabel').innerText = currentLang.toUpperCase();
            
            // Статические элементы
            $('selectMkvBtn').innerText = t.selectMode;
            $('t-selectFormat').innerText = t.selectFormat;
            $('t-dropHint').innerText = t.dropHint;
            $('convertBtn').innerText = t.convert;
            $('downloadBtn').innerText = t.download;
            $('resetBtn').innerText = t.convertNew;
            $('t-footer').innerText = t.footer;
            $('kamenLink').setAttribute('data-label', t.kamenHint);
            
            // Динамические статусы (если они сейчас отображаются)
            if ($('step3').classList.contains('active')) {
                // Если мы на шаге 3 (готовность), текст кнопки уже обновлен выше
            }
        }

        $('langSwitcher').onclick = toggleLang;
        // ------------------

        function showStep(n) {
            const steps = document.querySelectorAll('.step');
            steps.forEach((el, index) => {
                el.classList.toggle('active', index + 1 === n);
            });
            $('errorMsg').classList.add('hidden');
        }

        function updateProgress(percent, text) {
            $('progressBar').style.width = percent + '%';
            if (text) $('progressStatus').innerText = text;
        }

        const handleFile = (file) => {
            const t = i18n[currentLang];
            if (file && (file.name.toLowerCase().endsWith('.mkv') || file.type === 'video/x-matroska')) {
                window.selectedFile = file;
                $('fileName').innerText = file.name;
                showStep(3);
            } else {
                alert(t.selectMkvAlert);
            }
        };

        $('selectMkvBtn').onclick = () => showStep(2);

        $('dropZone').onclick = () => $('fileInput').click();
        $('fileInput').onchange = (e) => handleFile(e.target.files[0]);
        
        $('dropZone').ondragover = (e) => { e.preventDefault(); $('dropZone').classList.add('dragover'); };
        $('dropZone').ondragleave = () => $('dropZone').classList.remove('dragover');
        $('dropZone').ondrop = (e) => { e.preventDefault(); $('dropZone').classList.remove('dragover'); handleFile(e.dataTransfer.files[0]); };

        $('convertBtn').onclick = async () => {
            const t = i18n[currentLang];
            showStep(4);
            updateProgress(5, t.initializing);
            
            try {
                if (!ffmpeg.isLoaded()) {
                    updateProgress(15, t.loadingCore);
                    const originalSharedArrayBuffer = window.SharedArrayBuffer;
                    window.SharedArrayBuffer = undefined; 
                    await ffmpeg.load();
                    window.SharedArrayBuffer = originalSharedArrayBuffer;
                }

                updateProgress(40, t.readingFile);
                ffmpeg.FS('writeFile', 'input.mkv', await fetchFile(window.selectedFile));

                updateProgress(60, t.converting);
                await ffmpeg.run(
                    '-i', 'input.mkv', 
                    '-c', 'copy', 
                    '-sn', 
                    '-movflags', '+faststart', 
                    'output.mp4'
                );

                updateProgress(90, t.finalizing);
                const data = ffmpeg.FS('readFile', 'output.mp4');
                
                // Очистка старого URL перед созданием нового
                if (currentDownloadUrl) {
                    URL.revokeObjectURL(currentDownloadUrl);
                }
                
                const blob = new Blob([data.buffer], { type: 'video/mp4' });
                currentDownloadUrl = URL.createObjectURL(blob);
                
                $('downloadBtn').href = currentDownloadUrl;
                $('downloadBtn').download = window.selectedFile.name.replace(/\.mkv$/i, '.mp4');
                
                updateProgress(100, t.done);
                setTimeout(() => showStep(5), 400);

                // Очистка виртуальной файловой системы FFmpeg
                try {
                    ffmpeg.FS('unlink', 'input.mkv');
                    ffmpeg.FS('unlink', 'output.mp4');
                } catch (e) {
                    console.warn("Cleanup warning:", e);
                }
            } catch (err) {
                console.error(err);
                $('errorMsg').innerText = t.error + ": " + err.message;
                $('errorMsg').classList.remove('hidden');
                showStep(3);
                
                // Очистка FS в случае ошибки
                try {
                    ffmpeg.FS('unlink', 'input.mkv');
                } catch (e) {}
            }
        };

        $('resetBtn').onclick = async () => {
            window.selectedFile = null;
            $('fileInput').value = ''; // Сброс инпута в браузере
            
            if (currentDownloadUrl) {
                URL.revokeObjectURL(currentDownloadUrl);
                currentDownloadUrl = null;
            }
            
            // ВАЖНО: Выгружаем FFmpeg из ОЗУ, чтобы в следующий раз он загрузился чистым
            try {
                await ffmpeg.exit(); 
            } catch (e) {
                console.log("FFmpeg уже был выгружен или не инициализирован");
            }
            
            showStep(1);
        };
    </script>
</body>
</html>
