<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗂️</text></svg>">
    <title>Kamen & COnvert</title>
    
    <!-- Core Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gifshot@0.4.5/dist/gifshot.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/sumimakito/webpxmux.js@master/dist/webpxmux.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/Spuds0588/OpenDocument-Engine-Suite@odt-engine-v1.0.0/packages/odt-engine/dist/global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html-docx-js-static@0.3.1/dist/html-docx.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            background-color: #1a1a1a; 
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.02) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.02) 0%, transparent 50%);
            color: #d1d1d1; 
            font-family: 'Inter', sans-serif; 
            -webkit-font-smoothing: antialiased; 
            overflow-x: hidden;
        }
        .step { display: none; }
        .step.active { display: flex; }
        
        .stone-texture {
            background-color: #2a2a2a;
            background-image: url("https://www.transparenttextures.com/patterns/dark-matter.png");
            box-shadow: inset 2px 2px 5px rgba(255,255,255,0.05), inset -2px -2px 5px rgba(0,0,0,0.5), 8px 8px 20px rgba(0,0,0,0.4);
            border: 1px solid #333;
        }

        .drop-zone { border: 2px dashed rgba(255,255,255,0.08); transition: all 0.2s ease; cursor: pointer; border-radius: 40px; background-color: rgba(255,255,255,0.02); }
        .drop-zone:hover, .drop-zone.dragover { border-color: #fff; background-color: rgba(255,255,255,0.05); }
        .progress-bar { height: 100%; background: #fff; width: 0%; transition: width 0.4s ease; }
        button, .btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        button:active { transform: scale(0.97); }
        
        .header-title { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); width: 100%; text-align: center; animation: float 4s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -6px); } }

        .carved-text { font-family: 'Cinzel', serif; text-shadow: 1px 1px 1px rgba(255,255,255,0.1), -1px -1px 1px rgba(0,0,0,0.8); letter-spacing: 0.05em; }

        .kamen-link { color: #888; text-decoration: none; position: relative; transition: color 0.3s ease; }
        .kamen-link:hover { color: #fff; }
        .kamen-link::after {
            content: attr(data-label); position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); font-size: 9px; font-style: normal; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0; transition: all 0.3s ease; white-space: nowrap; color: #555; pointer-events: none;
        }
        .kamen-link:hover::after { opacity: 1; bottom: -28px; }

        .btn-kamen {
            background-color: #333; color: #ffffff; border-radius: 30px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.2em; 
            box-shadow: inset 1px 1px 0px rgba(255,255,255,0.1), 0 20px 40px rgba(0,0,0,0.4); border: 1px solid #444; font-family: 'Cinzel', serif;
        }
        .btn-kamen:hover { transform: translateY(-2px); background: #3a3a3a; box-shadow: 0 0 15px rgba(255, 255, 255, 0.1), inset 1px 1px 0px rgba(255,255,255,0.15), 6px 6px 15px rgba(0,0,0,0.6); border-color: #555; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-8 relative overflow-hidden">

    <div class="header-title">
        <h1 class="carved-text text-4xl font-black tracking-tighter italic text-white drop-shadow-2xl text-center">
            <a href="https://legimency.github.io/kamen3D/" target="_blank" class="kamen-link carved-text" id="kamenLink" data-label="click">Kamen</a> & COnvert
        </h1>
    </div>

    <main class="w-full max-w-md text-center mt-12 z-10">
        <!-- Step 1: Mode Selection -->
        <div id="step1" class="step active flex-col items-center w-full space-y-4 px-2">
            <button id="selectMkvBtn" class="w-full py-6 btn-kamen text-xl shadow-2xl cursor-pointer transition-all carved-text">.mkv to .mp4</button>
            <button id="selectWebpBtn" class="w-full py-6 btn-kamen text-xl shadow-2xl cursor-pointer transition-all carved-text">.webp to .gif</button>
            <button id="selectOdtBtn" class="w-full py-6 btn-kamen text-xl shadow-2xl cursor-pointer transition-all carved-text">.odt to .docx</button>
            <p class="mt-6 text-[8px] sm:text-[9px] text-gray-300 uppercase tracking-[0.3em] font-bold text-center whitespace-nowrap">Select the format for conversion</p>
        </div>

        <!-- Step 2: Upload -->
        <div id="step2" class="step flex-col items-center w-full">
            <div id="dropZone" class="w-full aspect-square flex flex-col items-center justify-center p-12 drop-zone shadow-2xl stone-texture">
                <div class="mb-6 opacity-30 text-white"><svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 4v16m8-8H4" stroke-linecap="round"/></svg></div>
                <p id="t-fileExt" class="font-bold text-sm uppercase tracking-[0.3em] mb-2 text-white carved-text">.mkv</p>
                <p class="text-[9px] text-gray-300 uppercase tracking-widest text-center font-bold px-4">drag & drop</p>
                <input type="file" id="fileInput" class="hidden">
            </div>
            <button id="backToModesBtn" class="mt-8 text-[9px] font-bold text-gray-300 hover:text-white uppercase tracking-[0.4em] cursor-pointer transition-colors">use a different format</button>
        </div>

        <!-- Step 3: Ready -->
        <div id="step3" class="step flex-col items-center w-full">
            <div class="w-full mb-8 py-10 px-6 bg-white/5 rounded-[40px] border border-white/5 overflow-hidden shadow-inner text-center stone-texture">
                <p id="fileName" class="text-[10px] font-mono truncate text-gray-400 uppercase tracking-widest"></p>
            </div>
            <button id="convertBtn" class="w-full py-6 btn-kamen text-lg shadow-2xl cursor-pointer transition-all carved-text">convert</button>
        </div>

        <!-- Step 4: Progress -->
        <div id="step4" class="step flex-col items-center w-full text-center">
            <div class="w-full bg-white/5 rounded-full h-1.5 mb-8 overflow-hidden text-left">
                <div id="progressBar" class="progress-bar shadow-[0_0_15px_rgba(255,255,255,0.5)]"></div>
            </div>
            <p id="progressStatus" class="text-[9px] font-black tracking-[0.5em] uppercase text-gray-500 italic animate-pulse">Processing...</p>
        </div>

        <!-- Step 5: Success -->
        <div id="step5" class="step flex-col items-center w-full text-center">
            <div class="w-24 h-24 bg-white text-black rounded-full flex items-center justify-center mb-10 shadow-2xl mx-auto">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <a id="downloadBtn" class="w-full py-6 btn-kamen text-lg shadow-2xl text-center block mb-6 cursor-pointer transition-all carved-text">download</a>
            <button id="resetBtn" class="text-[9px] font-bold text-gray-300 hover:text-white uppercase tracking-[0.4em] cursor-pointer transition-colors mx-auto">convert new file</button>
        </div>

        <div id="errorMsg" class="hidden mt-8 p-6 bg-red-500/10 text-red-400 text-[10px] rounded-[30px] font-mono border border-red-500/20"></div>
    </main>

    <footer class="fixed bottom-10 text-center px-4 w-full opacity-80">
        <p class="text-[8px] text-gray-300 uppercase tracking-[0.6em] font-medium italic">Conversion takes place locally</p>
    </footer>

    <script>
        // --- WORKER PROXY HACK FOR GITHUB PAGES ---
        (function() {
            const OriginalWorker = window.Worker;
            window.Worker = function(scriptURL, options) {
                if (typeof scriptURL === 'string' && scriptURL.includes('ffmpeg')) {
                    const blobCode = `importScripts("${scriptURL}");`;
                    const blobURL = URL.createObjectURL(new Blob([blobCode], { type: 'text/javascript' }));
                    return new OriginalWorker(blobURL, options);
                }
                return new OriginalWorker(scriptURL, options);
            };
        })();

        const { FFmpeg } = FFmpegWASM;
        const { fetchFile, toBlobURL } = FFmpegUtil;
        const $ = (id) => document.getElementById(id);

        let ffmpeg = null;
        let currentDownloadUrl = null, currentMode = 'mkv', selectedFile = null;

        function showStep(n) {
            document.querySelectorAll('.step').forEach((el, i) => el.classList.toggle('active', i + 1 === n));
            $('errorMsg').classList.add('hidden');
        }

        function updateProgress(p, t) {
            $('progressBar').style.width = p + '%';
            if (t) $('progressStatus').innerText = t;
        }

        async function initFFmpeg() {
            if (ffmpeg) return;
            ffmpeg = new FFmpeg();
            const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
            const ffmpegURL = 'https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd';
            
            await ffmpeg.load({
                coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
                wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
                workerLoadURL: await toBlobURL(`${ffmpegURL}/814.ffmpeg.js`, 'text/javascript')
            });
        }

        const handleFile = (file) => {
            if (!file) return;
            let valid = false;
            if (currentMode === 'mkv') valid = file.name.toLowerCase().endsWith('.mkv');
            else if (currentMode === 'webp') valid = file.name.toLowerCase().endsWith('.webp');
            else if (currentMode === 'odt') valid = file.name.toLowerCase().endsWith('.odt');
            
            if (valid) { selectedFile = file; $('fileName').innerText = file.name; showStep(3); } 
            else { alert(`Please select a valid .${currentMode} file`); }
        };

        $('selectMkvBtn').onclick = () => { currentMode = 'mkv'; $('fileInput').accept = '.mkv'; $('t-fileExt').innerText = '.mkv'; showStep(2); };
        $('selectWebpBtn').onclick = () => { currentMode = 'webp'; $('fileInput').accept = '.webp'; $('t-fileExt').innerText = '.webp'; showStep(2); };
        $('selectOdtBtn').onclick = () => { currentMode = 'odt'; $('fileInput').accept = '.odt'; $('t-fileExt').innerText = '.odt'; showStep(2); };
        $('backToModesBtn').onclick = () => showStep(1);
        $('dropZone').onclick = () => $('fileInput').click();
        $('fileInput').onchange = (e) => { if (e.target.files[0]) handleFile(e.target.files[0]); };
        
        window.addEventListener('dragover', (e) => e.preventDefault(), false);
        window.addEventListener('drop', (e) => e.preventDefault(), false);
        ['ondragover', 'ondragleave', 'ondrop'].forEach(ev => $('dropZone')[ev] = (e) => e.preventDefault());
        $('dropZone').ondrop = (e) => { if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); };

        $('convertBtn').onclick = async () => {
            showStep(4);
            updateProgress(5, "Initializing...");
            try {
                if (currentMode === 'mkv') {
                    await initFFmpeg();
                    updateProgress(30, "Reading file...");
                    await ffmpeg.writeFile('input.mkv', await fetchFile(selectedFile));
                    updateProgress(60, "Converting...");
                    await ffmpeg.exec(['-i', 'input.mkv', '-c', 'copy', '-sn', '-movflags', '+faststart', 'output.mp4']);
                    const data = await ffmpeg.readFile('output.mp4');
                    finish(new Blob([data.buffer], { type: 'video/mp4' }), ".mp4");
                } else if (currentMode === 'webp') {
                    updateProgress(20, "Decoding WebP...");
                    const xMux = WebPXMux("https://cdn.jsdelivr.net/gh/sumimakito/webpxmux.js@master/dist/webpxmux.wasm");
                    await xMux.waitRuntime();
                    const result = await xMux.decodeFrames(new Uint8Array(await selectedFile.arrayBuffer()));
                    const frameImages = [];
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                    canvas.width = result.width; canvas.height = result.height;
                    for (const frame of result.frames) {
                        const imageData = ctx.createImageData(result.width, result.height);
                        for (let i = 0; i < frame.rgba.length; i++) {
                            const val = frame.rgba[i], i4 = i * 4;
                            imageData.data[i4+0] = (val >> 24) & 0xff;
                            imageData.data[i4+1] = (val >> 16) & 0xff;
                            imageData.data[i4+2] = (val >> 8) & 0xff;
                            imageData.data[i4+3] = val & 0xff;
                        }
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.putImageData(imageData, 0, 0);
                        frameImages.push(canvas.toDataURL('image/png'));
                    }
                    updateProgress(70, "Encoding GIF...");
                    gifshot.createGIF({ images: frameImages, gifWidth: result.width, gifHeight: result.height, interval: (result.frames[0].duration || 100) / 1000, numFrames: result.frameCount, sampleInterval: 1 }, (obj) => {
                        if (!obj.error) finish(obj.image, ".gif", true);
                        else showError(obj.error);
                    });
                } else if (currentMode === 'odt') {
                    updateProgress(30, "Parsing ODT...");
                    const doc = await ODT.parseODT(selectedFile);
                    updateProgress(70, "Creating DOCX...");
                    finish(htmlDocx.asBlob(doc.toHTML()), ".docx");
                }
            } catch (err) { showError(err); }
        };

        function finish(data, ext, isDataUrl = false) {
            if (currentDownloadUrl) URL.revokeObjectURL(currentDownloadUrl);
            currentDownloadUrl = isDataUrl ? data : URL.createObjectURL(data);
            $('downloadBtn').href = currentDownloadUrl;
            $('downloadBtn').download = selectedFile.name.replace(/\.[^/.]+$/, "") + ext;
            updateProgress(100, "Done");
            setTimeout(() => showStep(5), 400);
        }

        function showError(err) {
            $('errorMsg').innerText = "ERROR: " + (err.message || err);
            $('errorMsg').classList.remove('hidden'); showStep(3);
        }

        $('resetBtn').onclick = () => {
            selectedFile = null; $('fileInput').value = '';
            if (currentDownloadUrl) { URL.revokeObjectURL(currentDownloadUrl); currentDownloadUrl = null; }
            showStep(1);
        };
    </script>
</body>
</html>
